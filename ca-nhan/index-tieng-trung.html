"1239": {"stt": "100", "vi": "Tôi <strong>cho</strong> anh ấy <strong>mượn</strong> một cuốn sách.", "zh": "Wǒ <strong>jiè gěi</strong> tā yī běn shū.", "han": "我借给他一本书。", "color": "#ffb703", "nvi": "toi cho anh ay muon mot cuon sach.", "nzh": "wo jie gei ta yi ben shu. 我借给他一本书。", "word_plain": "我借给他一本书。", "tts_lang": "zh-CN"}, "1240": {"stt": "1", "vi": "Đạo mà có thể diễn tả được thì không phải là đạo vĩnh cửu bất biến; tên mà có thể đặt ra để gọi nó thì không phải là tên vĩnh cửu bất biến.", "zh": "Dào kě dào, fēi cháng dào. Míng kě míng, fēi cháng míng.", "han": "道可道，非常道。名可名，非常名。", "color": "#3a86ff", "nvi": "dao ma co the dien ta duoc thi khong phai la dao vinh cuu bat bien; ten ma co the dat ra de goi no thi khong phai la ten vinh cuu bat bien.", "nzh": "dao ke dao, fei chang dao. ming ke ming, fei chang ming. 道可道，非常道。名可名，非常名。", "word_plain": "道可道，非常道。名可名，非常名。", "tts_lang": "zh-CN"}, "1241": {"stt": "2", "vi": "Bậc “thượng thiện”, giống như nước, nước thì ưa làm lợi cho vạn vật mà không tranh.", "zh": "Shàng shàn ruò shuǐ. Shuǐ shàn lì wànwù ér bù zhēng.", "han": "上善若水。水善利万物而不争。", "color": "#06d6a0", "nvi": "bac “thuong thien”, giong nhu nuoc, nuoc thi ua lam loi cho van vat ma khong tranh.", "nzh": "shang shan ruo shui. shui shan li wanwu er bu zheng. 上善若水。水善利万物而不争。", "word_plain": "上善若水。水善利万物而不争。", "tts_lang": "zh-CN"}, "1242": {"stt": "3", "vi": "Kẻ biết người là người khôn, kẻ tự biết mình là người sáng suốt.", "zh": "Zhī rén zhě zhì, zì zhī zhě míng.", "han": "知人者智，自知者明。", "color": "#ffb703", "nvi": "ke biet nguoi la nguoi khon, ke tu biet minh la nguoi sang suot.", "nzh": "zhi ren zhe zhi, zi zhi zhe ming. 知人者智，自知者明。", "word_plain": "知人者智，自知者明。", "tts_lang": "zh-CN"}, "1243": {"stt": "4", "vi": "Thắng được người là có sức mạnh, thắng được mình là kiên cường.", "zh": "Shèng rén zhě yǒu lì, zì shèng zhě qiáng.", "han": "胜人者有力，自胜者强。", "color": "#3a86ff", "nvi": "thang duoc nguoi la co suc manh, thang duoc minh la kien cuong.", "nzh": "sheng ren zhe you li, zi sheng zhe qiang. 胜人者有力，自胜者强。", "word_plain": "胜人者有力，自胜者强。", "tts_lang": "zh-CN"}, "1244": {"stt": "5", "vi": "Lời chân thật thì không hoa mỹ, lời hoa mỹ thì không chân thật.", "zh": "Xìn yán bù měi, měi yán bù xìn.", "han": "信言不美，美言不信。", "color": "#06d6a0", "nvi": "loi chan that thi khong hoa my, loi hoa my thi khong chan that.", "nzh": "xin yan bu mei, mei yan bu xin. 信言不美，美言不信。", "word_plain": "信言不美，美言不信。", "tts_lang": "zh-CN"}, "1245": {"stt": "6", "vi": "Cuộc hành trình vạn dặm bắt đầu từ một bước chân.", "zh": "Qiānlǐ zhī xíng, shǐ yú zú xià.", "han": "千里之行，始于足下。", "color": "#ffb703", "nvi": "cuoc hanh trinh van dam bat dau tu mot buoc chan.", "nzh": "qianli zhi xing, shi yu zu xia. 千里之行，始于足下。", "word_plain": "千里之行，始于足下。", "tts_lang": "zh-CN"}, "1246": {"stt": "7", "vi": "Dạo này béo lên rồi\nQuyết định phải giảm cân\nĂn ít và vận động\nNhất định sẽ thành công", "zh": "Zuì jìn biàn pàng le\njué dìng yào jiǎn féi\nshǎo chī duō yùn dòng\nyí dìng huì chéng gōng", "han": "最近变胖了\n决定要减肥\n少吃多运动\n一定会成功", "color": "#3a86ff", "nvi": "dao nay beo len roi quyet dinh phai giam can an it va van dong nhat dinh se thanh cong", "nzh": "zui jin bian pang le jue ding yao jian fei shao chi duo yun dong yi ding hui cheng gong 最近变胖了 决定要减肥 少吃多运动 一定会成功", "word_plain": "最近变胖了\n决定要减肥\n少吃多运动\n一定会成功", "tts_lang": "zh-CN"}, "1247": {"stt": "8", "vi": "Cặp sách đung đưa nhẹ\nBước vào cổng trường quen\nMột câu chào buổi sáng\nNiềm vui đầy trong tim", "zh": "Bèi bāo qīng qīng yáo\nzǒu jìn xué xiào dào\nqīng shēng shuō zǎo ān\nkuài lè mǎn xīn jiān", "han": "背包轻轻摇\n走进学校道\n轻声说早安\n快乐满心间", "color": "#06d6a0", "nvi": "cap sach dung dua nhe buoc vao cong truong quen mot cau chao buoi sang niem vui day trong tim", "nzh": "bei bao qing qing yao zou jin xue xiao dao qing sheng shuo zao an kuai le man xin jian 背包轻轻摇 走进学校道 轻声说早安 快乐满心间", "word_plain": "背包轻轻摇\n走进学校道\n轻声说早安\n快乐满心间", "tts_lang": "zh-CN"}, "1248": {"stt": "9", "vi": "Muốn lưu loát trọn vẹn\nPhải tốn một, hai năm\nMưa càng dầm càng thấm\nNgày ấy chẳng còn xa", "zh": "Xiǎng yào quán liú lì\nxū yī liǎng nián gōng\njiǔ yǔ bì shēn tòu\nnà tiān bù zài yuǎn", "han": "想要全流利\n需一两年功\n久雨必渗透\n那天不再远", "color": "#ffb703", "nvi": "muon luu loat tron ven phai ton mot, hai nam mua cang dam cang tham ngay ay chang con xa", "nzh": "xiang yao quan liu li xu yi liang nian gong jiu yu bi shen tou na tian bu zai yuan 想要全流利 需一两年功 久雨必渗透 那天不再远", "word_plain": "想要全流利\n需一两年功\n久雨必渗透\n那天不再远", "tts_lang": "zh-CN"}, "1249": {"stt": "10", "vi": "Học vấn tuy quan trọng\nĐức hạnh quý hơn nhiều\nBiết bao dung người khác\nẤy tựa bậc cao nhân", "zh": "Xué wèn suī zhàng yào\ndé xíng gèng kě guì\nnéng gòu róng tā cuò\nfāng sì gāo rén xīn", "han": "学问虽重要\n德行更可贵\n能够容他错\n方似高人心", "color": "#3a86ff", "nvi": "hoc van tuy quan trong duc hanh quy hon nhieu biet bao dung nguoi khac ay tua bac cao nhan", "nzh": "xue wen sui zhang yao de xing geng ke gui neng gou rong ta cuo fang si gao ren xin 学问虽重要 德行更可贵 能够容他错 方似高人心", "word_plain": "学问虽重要\n德行更可贵\n能够容他错\n方似高人心", "tts_lang": "zh-CN"}, "1250": {"stt": "11", "vi": "Thấy người có điểm tốt\nChân thành học hỏi theo\nKhông tranh cũng không đấu\nĐời đẹp đẽ hơn nhiều", "zh": "Jiàn rén yǒu yǒu diǎn\nzhēn xīn qù xué xí\nbù zhēng yě bù dòu\nrén shēng gèng měi lì", "han": "见人有优点\n真心去学习\n不争也不斗\n人生更美丽", "color": "#06d6a0", "nvi": "thay nguoi co diem tot chan thanh hoc hoi theo khong tranh cung khong dau doi dep de hon nhieu", "nzh": "jian ren you you dian zhen xin qu xue xi bu zheng ye bu dou ren sheng geng mei li 见人有优点 真心去学习 不争也不斗 人生更美丽", "word_plain": "见人有优点\n真心去学习\n不争也不斗\n人生更美丽", "tts_lang": "zh-CN"}, "1251": {"stt": "13", "vi": "Thản nhiên nhìn được mất.\nBình lặng trước khen chê.\nLòng này không vướng bận.\nTiêu dao đời trôi qua.", "zh": "Tǎn rán guān dé shī.\nJìng duì huǐ yù yù.\nCǐ xīn wú suǒ xì.\nXiāo yáo rèn qù lái.", "han": "坦然观得失。\n静对毁与誉。\n此心无所系。\n逍遥任去来。", "color": "#ffb703", "nvi": "than nhien nhin duoc mat. binh lang truoc khen che. long nay khong vuong ban. tieu dao doi troi qua.", "nzh": "tan ran guan de shi. jing dui hui yu yu. ci xin wu suo xi. xiao yao ren qu lai. 坦然观得失。 静对毁与誉。 此心无所系。 逍遥任去来。", "word_plain": "坦然观得失。\n静对毁与誉。\n此心无所系。\n逍遥任去来。", "tts_lang": "zh-CN"}, "1252": {"stt": "14", "vi": "Lùi thêm một bước nhỏ.\nTrời đất rộng mênh mang.\nThắng người đâu ích lợi.\nThắng mình mới vẻ vang.", "zh": "Tuì yī bù hǎi kuò.\nTiān dì zì yōu yōu.\nShèng rén hé zú guì.\nShèng jǐ shǐ wèi yōu.", "han": "退一步海阔。\n天地自悠悠。\n胜人何足贵。\n胜己始为优。", "color": "#3a86ff", "nvi": "lui them mot buoc nho. troi dat rong menh mang. thang nguoi dau ich loi. thang minh moi ve vang.", "nzh": "tui yi bu hai kuo. tian di zi you you. sheng ren he zu gui. sheng ji shi wei you. 退一步海阔。 天地自悠悠。 胜人何足贵。 胜己始为优。", "word_plain": "退一步海阔。\n天地自悠悠。\n胜人何足贵。\n胜己始为优。", "tts_lang": "zh-CN"}, "1253": {"stt": "15", "vi": "Gieo thiện gặt điều thiện.\nGieo ác nhận ưu phiền.\nNhân quả chẳng thiên vị.\nẤy là lẽ tự nhiên.", "zh": "Zhǒng shàn dé shàn bào.\nZhǒng è shòu yōu fán.\nYīn guǒ wú piān yì.\nCǐ nǎi zì rán lǐ.", "han": "种善得善报。\n种恶受忧烦。\n因果无偏倚。\n此乃自然理。", "color": "#06d6a0", "nvi": "gieo thien gat dieu thien. gieo ac nhan uu phien. nhan qua chang thien vi. ay la le tu nhien.", "nzh": "zhong shan de shan bao. zhong e shou you fan. yin guo wu pian yi. ci nai zi ran li. 种善得善报。 种恶受忧烦。 因果无偏倚。 此乃自然理。", "word_plain": "种善得善报。\n种恶受忧烦。\n因果无偏倚。\n此乃自然理。", "tts_lang": "zh-CN"}, "1254": {"stt": "16", "vi": "Đặt ra mục tiêu nhỏ.\nMỗi ngày đều hoàn thành.\nTrước đây thường bỏ cuộc.\nGiờ đã có phương hướng.", "zh": "Shè dìng xiǎo mù biāo.\nMěi tiān dōu wán chéng.\nYǐ qián cháng fàng qì.\nXiàn zài yǒu fāng xiàng.", "han": "设定小目标。\n每天都完成。\n以前常放弃。\n现在有方向。", "color": "#ffb703", "nvi": "dat ra muc tieu nho. moi ngay deu hoan thanh. truoc day thuong bo cuoc. gio da co phuong huong.", "nzh": "she ding xiao mu biao. mei tian dou wan cheng. yi qian chang fang qi. xian zai you fang xiang. 设定小目标。 每天都完成。 以前常放弃。 现在有方向。", "word_plain": "设定小目标。\n每天都完成。\n以前常放弃。\n现在有方向。", "tts_lang": "zh-CN"}, "1255": {"stt": "17", "vi": "Việc hôm nay làm trọn,\nChớ hẹn đến ngày mai.\nNgười biết giữ kỷ luật,\nKhông sớm cũng thành tài.", "zh": "Jīn rì shì dāng bì.\nMò dài míng cháo chí.\nRén néng shǒu jì lǜ.\nChízǎo bì chéng cái.", "han": "今日事当毕。\n莫待明朝迟。\n人能守纪律。\n迟早必成才。", "color": "#3a86ff", "nvi": "viec hom nay lam tron, cho hen den ngay mai. nguoi biet giu ky luat, khong som cung thanh tai.", "nzh": "jin ri shi dang bi. mo dai ming chao chi. ren neng shou ji lu. chizao bi cheng cai. 今日事当毕。 莫待明朝迟。 人能守纪律。 迟早必成才。", "word_plain": "今日事当毕。\n莫待明朝迟。\n人能守纪律。\n迟早必成才。", "tts_lang": "zh-CN"}, "1256": {"stt": "18", "vi": "Trải qua điều cay đắng,\nMới hiểu được ngọt bùi.\nNếm qua điều đau khổ,\nÂu mới hiểu niềm vui.", "zh": "Lì jìn rén jiān kǔ.\nFāng zhī gān wèi tián.\nCháng guò qiān bān tòng.\nFāng dǒng xiào zhōng huān.", "han": "历尽人间苦，\n方知甘味甜。\n尝过千般痛，\n方懂笑中欢。", "color": "#06d6a0", "nvi": "trai qua dieu cay dang, moi hieu duoc ngot bui. nem qua dieu dau kho, au moi hieu niem vui.", "nzh": "li jin ren jian ku. fang zhi gan wei tian. chang guo qian ban tong. fang dong xiao zhong huan. 历尽人间苦， 方知甘味甜。 尝过千般痛， 方懂笑中欢。", "word_plain": "历尽人间苦，\n方知甘味甜。\n尝过千般痛，\n方懂笑中欢。", "tts_lang": "zh-CN"}, "1257": {"stt": "19", "vi": "Danh nhiều thêm nặng gánh,\nLợi lớn lắm ưu phiền.\nBiết đủ lòng thanh thản,\nNgày nào cũng bình yên.", "zh": "Míng duō zēng zhòng fù.\nLì dà rě yōu fán.\nZhī zú xīn cháng jìng.\nRì rì dé píng ān.", "han": "名多增重负，\n利大惹忧烦。\n知足心常静，\n日日得平安。", "color": "#ffb703", "nvi": "danh nhieu them nang ganh, loi lon lam uu phien. biet du long thanh than, ngay nao cung binh yen.", "nzh": "ming duo zeng zhong fu. li da re you fan. zhi zu xin chang jing. ri ri de ping an. 名多增重负， 利大惹忧烦。 知足心常静， 日日得平安。", "word_plain": "名多增重负，\n利大惹忧烦。\n知足心常静，\n日日得平安。", "tts_lang": "zh-CN"}, "1258": {"stt": "20", "vi": "Mỗi ngày thêm một bước,\nNăm tháng hóa đường dài.\nChẳng so đo thiên hạ,\nChỉ cần thắng chính ta.", "zh": "Měi rì tiān yī bù.\nSuì yuè huà cháng tú.\nBù yǔ tiān xià jiào.\nWéi shèng zì jǐ zú.", "han": "每日添一步。\n岁月化长途。\n不与天下较。\n唯胜自己足。", "color": "#3a86ff", "nvi": "moi ngay them mot buoc, nam thang hoa duong dai. chang so do thien ha, chi can thang chinh ta.", "nzh": "mei ri tian yi bu. sui yue hua chang tu. bu yu tian xia jiao. wei sheng zi ji zu. 每日添一步。 岁月化长途。 不与天下较。 唯胜自己足。", "word_plain": "每日添一步。\n岁月化长途。\n不与天下较。\n唯胜自己足。", "tts_lang": "zh-CN"}, "1259": {"stt": "21", "vi": "Giấy khó gói được lửa,\nKim giấu lâu cũng lòi.\nThiện ác đều có dấu,\nLương tâm chẳng vị tư.", "zh": "Zhǐ bāo zhōng nán huǒ.\nZhēn jiǔ bì zhōng chū.\nShàn è jiē liú jì.\nTiān xīn cóng bù sī.", "han": "纸包终难火。\n针久必终出。\n善恶皆留迹。\n天心从不私。", "color": "#06d6a0", "nvi": "giay kho goi duoc lua, kim giau lau cung loi. thien ac deu co dau, luong tam chang vi tu.", "nzh": "zhi bao zhong nan huo. zhen jiu bi zhong chu. shan e jie liu ji. tian xin cong bu si. 纸包终难火。 针久必终出。 善恶皆留迹。 天心从不私。", "word_plain": "纸包终难火。\n针久必终出。\n善恶皆留迹。\n天心从不私。", "tts_lang": "zh-CN"}, "1260": {"stt": "22", "vi": "Sai rồi biết nhận lỗi,\nChẳng mất mặt chút nào.\nBiết sai mà sửa đổi,\nMới đáng bậc anh hào.", "zh": "Yǐ cuò biàn rèn cuò.\nBù sǔn bàn fēn yán.\nZhī fēi dāng jí gǎi.\nFāng shì zhēn háo jié.", "han": "已错便认错。\n不损半分颜。\n知非当即改。\n方是真豪杰。", "color": "#ffb703", "nvi": "sai roi biet nhan loi, chang mat mat chut nao. biet sai ma sua doi, moi dang bac anh hao.", "nzh": "yi cuo bian ren cuo. bu sun ban fen yan. zhi fei dang ji gai. fang shi zhen hao jie. 已错便认错。 不损半分颜。 知非当即改。 方是真豪杰。", "word_plain": "已错便认错。\n不损半分颜。\n知非当即改。\n方是真豪杰。", "tts_lang": "zh-CN"}, "1261": {"stt": "23", "vi": "Chẳng có đời bình lặng,\nChỉ có người bình yên.\nLòng buông bỏ lo lắng,\nTâm ai chẳng muộn phiền.", "zh": "Shì wú píng jìng rì.\nWéi yǒu jìng xīn rén.\nFàng xià xīn zhōng lǜ.\nZì wú fán nǎo qīn.", "han": "世无平静日，\n唯有静心人。\n放下心中虑，\n自无烦恼侵。", "color": "#3a86ff", "nvi": "chang co doi binh lang, chi co nguoi binh yen. long buong bo lo lang, tam ai chang muon phien.", "nzh": "shi wu ping jing ri. wei you jing xin ren. fang xia xin zhong lu. zi wu fan nao qin. 世无平静日， 唯有静心人。 放下心中虑， 自无烦恼侵。", "word_plain": "世无平静日，\n唯有静心人。\n放下心中虑，\n自无烦恼侵。", "tts_lang": "zh-CN"}, "1262": {"stt": "24", "vi": "Người sai chớ ghét bỏ,\nAi chẳng lúc sai lầm.\nBao dung thêm một chút,\nĐời nhẹ tựa khói mây.", "zh": "Rén cuò mò xiāng xián.\nShuí wú yī shí qiān.\nKuān róng tiān yī niàn.\nRén shēng ruò xiǎo yān.", "han": "人错莫相嫌，\n谁无一时愆。\n宽容添一念，\n人生若晓烟。", "color": "#06d6a0", "nvi": "nguoi sai cho ghet bo, ai chang luc sai lam. bao dung them mot chut, doi nhe tua khoi may.", "nzh": "ren cuo mo xiang xian. shui wu yi shi qian. kuan rong tian yi nian. ren sheng ruo xiao yan. 人错莫相嫌， 谁无一时愆。 宽容添一念， 人生若晓烟。", "word_plain": "人错莫相嫌，\n谁无一时愆。\n宽容添一念，\n人生若晓烟。", "tts_lang": "zh-CN"}, "1263": {"stt": "25", "vi": "Tiếng Trung nói thật giỏi,\nKhách hàng đều khen hay.\nCông ty rất cần đến,\nLương tự nhiên tăng cao.", "zh": "Zhōng wén shuō de hǎo.\nKè rén dōu chēng zàn.\nGōng sī hěn xū yào.\nXīn shuǐ zì rán gāo.", "han": "中文说得好。\n客人都称赞。\n公司很需要。\n薪水自然高。", "color": "#ffb703", "nvi": "tieng trung noi that gioi, khach hang deu khen hay. cong ty rat can den, luong tu nhien tang cao.", "nzh": "zhong wen shuo de hao. ke ren dou cheng zan. gong si hen xu yao. xin shui zi ran gao. 中文说得好。 客人都称赞。 公司很需要。 薪水自然高。", "word_plain": "中文说得好。\n客人都称赞。\n公司很需要。\n薪水自然高。", "tts_lang": "zh-CN"}, "1264": {"stt": "26", "vi": "Hạnh phúc tìm đâu xa,\nỞ bên cạnh chúng ta.\nChỉ cần lòng biết đủ,\nCuộc sống luôn an hòa.", "zh": "Xìng fú hé xū yuǎn.\nShēn biān běn zì cún.\nDàn qiú xīn zhī zú.\nShēng huó yǒng ān níng.", "han": "幸福何须远。\n身边本自存。\n但求心知足。\n生活永安宁。", "color": "#3a86ff", "nvi": "hanh phuc tim dau xa, o ben canh chung ta. chi can long biet du, cuoc song luon an hoa.", "nzh": "xing fu he xu yuan. shen bian ben zi cun. dan qiu xin zhi zu. sheng huo yong an ning. 幸福何须远。 身边本自存。 但求心知足。 生活永安宁。", "word_plain": "幸福何须远。\n身边本自存。\n但求心知足。\n生活永安宁。", "tts_lang": "zh-CN"}, "1265": {"stt": "27", "vi": "Đường dài đâu đáng ngại,\nChỉ sợ muốn dừng chân.\nHọc hoài rồi cũng giỏi,\nLòng bền tự thành công.", "zh": "Cháng lù hé zú wèi.\nZhǐ pà yù tíng xíng.\nQín xué zhōng chéng qiǎo.\nHéng xīn zì yǒu chéng.", "han": "长路何足畏，\n只怕欲停行。\n勤学终成巧，\n恒心自有成。", "color": "#06d6a0", "nvi": "duong dai dau dang ngai, chi so muon dung chan. hoc hoai roi cung gioi, long ben tu thanh cong.", "nzh": "chang lu he zu wei. zhi pa yu ting xing. qin xue zhong cheng qiao. heng xin zi you cheng. 长路何足畏， 只怕欲停行。 勤学终成巧， 恒心自有成。", "word_plain": "长路何足畏，\n只怕欲停行。\n勤学终成巧，\n恒心自有成。", "tts_lang": "zh-CN"}, "1266": {"stt": "28", "vi": "Lời đồn như tên bắn,\nGiương cung chẳng quay đầu.\nĐừng gieo lời cay nghiệt,\nChỉ rước khổ thêm sầu.", "zh": "Liú yán fēi sì jiàn.\nNán fǎn yǐ lí xián.\nMò zhǒng shāng rén yǔ.\nHuí tóu lèi mǎn chuān.", "han": "流言飞似箭，\n难返已离弦。\n莫种伤人语，\n回头泪满川。", "color": "#ffb703", "nvi": "loi don nhu ten ban, giuong cung chang quay dau. dung gieo loi cay nghiet, chi ruoc kho them sau.", "nzh": "liu yan fei si jian. nan fan yi li xian. mo zhong shang ren yu. hui tou lei man chuan. 流言飞似箭， 难返已离弦。 莫种伤人语， 回头泪满川。", "word_plain": "流言飞似箭，\n难返已离弦。\n莫种伤人语，\n回头泪满川。", "tts_lang": "zh-CN"}, "1267": {"stt": "29", "vi": "Mang trong tâm chí lớn,\nBước từng bước vững vàng.\nHôm nay chăm gieo hạt,\nNgày mai gặt huy hoàng.", "zh": "Xīn huái qīng yún zhì.\nJiǎo tà cùn cùn chéng.\nJīn rì qín gēng zhòng.\nMíng zhāo shōu huī huáng.", "han": "心怀青云志。\n脚踏寸寸程。\n今日勤耕种。\n明朝收辉煌。", "color": "#3a86ff", "nvi": "mang trong tam chi lon, buoc tung buoc vung vang. hom nay cham gieo hat, ngay mai gat huy hoang.", "nzh": "xin huai qing yun zhi. jiao ta cun cun cheng. jin ri qin geng zhong. ming zhao shou hui huang. 心怀青云志。 脚踏寸寸程。 今日勤耕种。 明朝收辉煌。", "word_plain": "心怀青云志。\n脚踏寸寸程。\n今日勤耕种。\n明朝收辉煌。", "tts_lang": "zh-CN"}};
  const TOTAL_COUNT = Object.keys(PAIRS).length;

  let currentSection = 0;
  let currentPage = 0;
  let activeId = null;
  // viewMode: 'normal' (phan trang binh thuong) | 'search' | 'mark' (loc cau
  // danh dau chua nam vung). Chi 1 trong 3 che do duoc bat tai 1 thoi diem.
  let viewMode = 'normal';
  let markedIds = new Set();
  try {
    const savedMarks = JSON.parse(localStorage.getItem('bilingualMarked') || '[]');
    markedIds = new Set(savedMarks.map(x => parseInt(x, 10)));
  } catch (e) {}

  // Nhay thang len dau trang, khong hieu ung cuon. Dat truc tiep scrollTop
  // (thay vi chi goi window.scrollTo) vi mot so trinh duyet mobile (dac biet
  // Safari) cuon co giat/hoat hinh khi trang co phan tu position:sticky.
  function scrollToTop() {
    // Bo focus khoi nut/select vua bam de trinh duyet mobile khong tu cuon
    // theo phan tu dang focus (co the ghi de len vi tri ta vua dat).
    if (document.activeElement && document.activeElement.blur) {
      document.activeElement.blur();
    }
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function currentPages() {
    return SECTIONS[currentSection].pages;
  }

  function normalizeSearch(str) {
    return str
      .replace(/\u0111/g, 'd').replace(/\u0110/g, 'D')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim();
  }

  function makeItem(side, id) {
    const p = PAIRS[id];
    const div = document.createElement('div');
    div.className = 'item';
    div.id = side + '-' + id;
    div.dataset.pair = id;
    div.dataset.color = p.color;
    div.tabIndex = 0;
    const sttSpan = document.createElement('span');
    sttSpan.className = 'stt';
    sttSpan.textContent = p.stt;
    const txtSpan = document.createElement('span');
    txtSpan.className = 'txt';
    // p.vi / p.zh / p.han la HTML da duoc escape san o phia Python, co the
    // chua <strong> de giu dinh dang in dam tu Excel -> gan qua innerHTML.
    if (side === 'zh' && p.han) {
      const hanEl = document.createElement('span');
      hanEl.className = 'hanzi';
      hanEl.innerHTML = p.han;
      txtSpan.appendChild(hanEl);
      if (p.zh) {
        const pinyinEl = document.createElement('span');
        pinyinEl.className = 'pinyin';
        pinyinEl.innerHTML = p.zh;
        txtSpan.appendChild(pinyinEl);
      }
    } else {
      txtSpan.innerHTML = side === 'vi' ? p.vi : p.zh;
    }
    const markBtn = document.createElement('button');
    markBtn.type = 'button';
    markBtn.className = 'mark-btn' + (markedIds.has(id) ? ' marked' : '');
    markBtn.title = 'Danh dau cau chua nam vung';
    markBtn.innerHTML = ICON_CHECK;
    markBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMark(id);
    });

    div.appendChild(sttSpan);
    div.appendChild(txtSpan);

    // Nut phat am (Google TTS) - chi hien o cot ngon ngu dich, va chi khi
    // nhan ra duoc ma ngon ngu tu ten cot.
    if (side === 'zh' && p.tts_lang && p.word_plain) {
      const speakBtn = document.createElement('button');
      speakBtn.type = 'button';
      speakBtn.className = 'speak-btn';
      speakBtn.title = 'Nghe phat am (Google, can Internet)';
      speakBtn.innerHTML = ICON_SPEAKER;
      speakBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playTTS(p.word_plain, p.tts_lang, speakBtn);
      });
      div.appendChild(speakBtn);
    }

    div.appendChild(markBtn);
    div.addEventListener('click', () => highlightPair(id, div));
    div.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') highlightPair(id, div);
    });
    return div;
  }

  function renderColumns(viIds, zhIds) {
    const viCol = document.getElementById('viCol');
    const zhCol = document.getElementById('zhCol');
    viCol.innerHTML = '';
    zhCol.innerHTML = '';
    activeId = null;

    if (viIds.length === 0) {
      viCol.innerHTML = '<div class="empty">Khong co cau nao phu hop.</div>';
      zhCol.innerHTML = '<div class="empty">Khong co cau nao phu hop.</div>';
      return;
    }
    viIds.forEach(id => viCol.appendChild(makeItem('vi', id)));
    zhIds.forEach(id => zhCol.appendChild(makeItem('zh', id)));
  }

  function renderSectionList() {
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggleBtn');
    const list = document.getElementById('sectionList');
    list.innerHTML = '';

    const hasMultipleSections = SECTIONS.length > 1;
    const hasAnyTopics = SECTIONS.some(sec => sec.has_topic);
    if (!hasMultipleSections && !hasAnyTopics) {
      sidebar.style.display = 'none';
      toggleBtn.style.display = 'none';
      return;
    }
    sidebar.style.display = '';
    toggleBtn.style.display = '';

    SECTIONS.forEach((sec, si) => {
      const group = document.createElement('div');
      group.className = 'section-group';

      if (hasMultipleSections) {
        const btn = document.createElement('button');
        btn.textContent = sec.title;
        btn.className = 'section-item';
        btn.classList.toggle('active', si === currentSection);
        btn.onclick = () => gotoSection(si);
        group.appendChild(btn);
      }

      // Danh sach chu de cua section, hien nhu 1 sub-menu ngay duoi ten
      // section (chi hien cho section dang duoc chon, va chi khi section
      // co cot Chu de thuc su - tranh liet ke hang chuc trang STT vo nghia).
      if (sec.has_topic && sec.pages.length > 1 && si === currentSection) {
        const sub = document.createElement('div');
        sub.className = 'topic-list';
        sec.pages.forEach((pg, pi) => {
          const tbtn = document.createElement('button');
          tbtn.textContent = pg.label;
          tbtn.className = 'topic-item';
          tbtn.classList.toggle('active', pi === currentPage);
          tbtn.onclick = () => {
            gotoPage(pi);
            document.getElementById('sidebar').classList.add('collapsed');
          };
          sub.appendChild(tbtn);
        });
        group.appendChild(sub);
      }

      list.appendChild(group);
    });
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
  }

  function updateLangLabel() {
    document.getElementById('zhColLabel').textContent = SECTIONS[currentSection].lang_label;
  }

  function gotoSection(index) {
    if (index < 0 || index >= SECTIONS.length) return;
    currentSection = index;
    currentPage = 0;
    viewMode = 'normal';
    document.getElementById('searchInput').value = '';
    document.getElementById('markFilterBtn').classList.remove('active');
    renderSectionList();
    updateLangLabel();
    document.getElementById('sidebar').classList.add('collapsed');
    const pg = currentPages()[currentPage];
    renderColumns(pg.vi, pg.zh);
    renderPager();
    updateFooter();
    scrollToTop();
  }

  function fillPagerControls(toolbarId, selectId, prevId, nextId, pages) {
    const toolbar = document.getElementById(toolbarId);
    if (pages.length <= 1) {
      toolbar.style.display = 'none';
      return;
    }
    toolbar.style.display = viewMode !== 'normal' ? 'none' : 'flex';
    const select = document.getElementById(selectId);
    select.innerHTML = '';
    pages.forEach((pg, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = pg.label;
      select.appendChild(opt);
    });
    select.value = currentPage;
    document.getElementById(prevId).disabled = currentPage === 0;
    document.getElementById(nextId).disabled = currentPage === pages.length - 1;
  }

  function renderPager() {
    const pages = currentPages();
    fillPagerControls('pagerToolbar', 'pageSelect', 'prevBtn', 'nextBtn', pages);
    fillPagerControls('pagerToolbarBottom', 'pageSelectBottom', 'prevBtnBottom', 'nextBtnBottom', pages);
  }

  function updateFooter() {
    const footer = document.getElementById('footerInfo');
    const pages = currentPages();
    if (viewMode === 'search') {
      const input = document.getElementById('searchInput');
      const shown = document.querySelectorAll('#viCol .item').length;
      footer.textContent = shown + ' / ' + TOTAL_COUNT + ' cau phu hop voi "' + input.value.trim() + '"';
    } else if (viewMode === 'mark') {
      const shown = document.querySelectorAll('#viCol .item').length;
      footer.textContent = shown + ' cau dang danh dau chua nam vung (trong tong so ' + TOTAL_COUNT + ' cau)';
    } else {
      footer.textContent = TOTAL_COUNT + ' cap cau' +
        (SECTIONS.length > 1 ? ' · section "' + SECTIONS[currentSection].title + '"' : '') +
        (pages.length > 1 ? ' · trang ' + (currentPage + 1) + '/' + pages.length : '') +
        ' · click hoac nhan Enter tren mot cau de ghep cap';
    }
  }

  function gotoPage(index) {
    const pages = currentPages();
    if (index < 0 || index >= pages.length) return;
    currentPage = index;
    const pg = pages[currentPage];
    renderColumns(pg.vi, pg.zh);
    renderPager();
    renderSectionList();
    updateFooter();
    scrollToTop();
  }

  function runSearch(query) {
    const norm = normalizeSearch(query);
    if (!norm) {
      viewMode = 'normal';
      renderSectionList();
      renderPager();
      gotoPage(currentPage);
      return;
    }
    viewMode = 'search';
    document.getElementById('markFilterBtn').classList.remove('active');
    const matched = Object.keys(PAIRS)
      .filter(id => PAIRS[id].nvi.includes(norm) || PAIRS[id].nzh.includes(norm))
      .map(id => parseInt(id, 10))
      .sort((a, b) => a - b);
    renderSectionList();
    renderPager();
    renderColumns(matched, matched);
    updateFooter();
  }

  function saveMarked() {
    try { localStorage.setItem('bilingualMarked', JSON.stringify([...markedIds])); } catch (e) {}
  }

  function updateMarkCount() {
    document.getElementById('markCount').textContent = markedIds.size;
  }

  function updateMarkButtons(id) {
    const marked = markedIds.has(id);
    ['vi', 'zh'].forEach(side => {
      const el = document.getElementById(side + '-' + id);
      if (!el) return;
      const btn = el.querySelector('.mark-btn');
      if (btn) btn.classList.toggle('marked', marked);
    });
  }

  function toggleMark(id) {
    if (markedIds.has(id)) {
      markedIds.delete(id);
    } else {
      markedIds.add(id);
    }
    saveMarked();
    updateMarkCount();
    updateMarkButtons(id);
    if (viewMode === 'mark') {
      applyMarkFilter();
    }
  }

  function applyMarkFilter() {
    const ids = [...markedIds].sort((a, b) => a - b);
    renderPager();
    renderColumns(ids, ids);
    updateFooter();
  }

  function toggleMarkFilter() {
    const btn = document.getElementById('markFilterBtn');
    if (viewMode === 'mark') {
      viewMode = 'normal';
      btn.classList.remove('active');
      renderPager();
      gotoPage(currentPage);
      return;
    }
    viewMode = 'mark';
    btn.classList.add('active');
    document.getElementById('searchInput').value = '';
    applyMarkFilter();
  }

  function clearAllMarks() {
    if (markedIds.size === 0) return;
    if (!confirm('Xoa danh dau cua tat ca ' + markedIds.size + ' cau chua nam vung?')) return;
    markedIds.clear();
    saveMarked();
    updateMarkCount();
    document.querySelectorAll('.mark-btn.marked').forEach(btn => btn.classList.remove('marked'));
    if (viewMode === 'mark') {
      applyMarkFilter();
    }
  }

  function allItems(id) {
    return [
      document.getElementById('vi-' + id),
      document.getElementById('zh-' + id)
    ].filter(Boolean);
  }

  function clearHighlight() {
    document.querySelectorAll('.item').forEach(el => {
      el.classList.remove('active-self', 'pulse');
      el.style.background = '';
      el.style.borderColor = '';
      el.style.color = '';
    });
    activeId = null;
  }

  function paintPair(id, temporary) {
    const color = PAIRS[id] ? PAIRS[id].color : null;
    allItems(id).forEach(el => {
      el.style.background = color;
      el.style.borderColor = color;
      el.style.color = '#0f1115';
      if (temporary) {
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 1400);
      }
    });
  }

  function highlightPair(id, sourceEl) {
    if (activeId === id) {
      clearHighlight();
      return;
    }
    clearHighlight();
    activeId = id;
    paintPair(id, false);
    sourceEl.classList.add('active-self');

    // cuon phia con lai vao khung nhin
    const other = [...allItems(id)].find(el => el !== sourceEl);
    if (other) {
      other.scrollIntoView({ behavior: 'auto', block: 'center' });
      other.classList.add('pulse');
      setTimeout(() => other.classList.remove('pulse'), 1400);
    }
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    runSearch(e.target.value);
  });

  const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle>' +
    '<line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>' +
    '<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>' +
    '<line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>' +
    '<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
  const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
  const ICON_LIST = '<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line>' +
    '<line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  const ICON_SPEAKER = '<svg viewBox="0 0 24 24"><polygon points="3 9 8 9 13 4 13 20 8 15 3 15 3 9"></polygon>' +
    '<path d="M16 8.5a4.5 4.5 0 0 1 0 7"></path><path d="M18.5 6a8 8 0 0 1 0 12"></path></svg>';

  // Phat am qua Google Translate TTS (dich vu mien phi, khong chinh thuc -
  // can Internet, gioi han ~200 ky tu/lan goi nen cau dai se duoc cat nho
  // va phat noi tiep nhau).
  let ttsAudio = null;

  function splitForTTS(text) {
    const maxLen = 190;
    const trimmed = text.trim();
    if (trimmed.length <= maxLen) return [trimmed];
    const parts = [];
    let rest = trimmed;
    while (rest.length > maxLen) {
      let cut = rest.lastIndexOf(' ', maxLen);
      if (cut <= 0) cut = maxLen;
      parts.push(rest.slice(0, cut).trim());
      rest = rest.slice(cut).trim();
    }
    if (rest) parts.push(rest);
    return parts.filter(Boolean);
  }

  function playTTS(text, lang, btn) {
    if (!text || !lang) return;
    if (ttsAudio) {
      ttsAudio.pause();
      ttsAudio = null;
    }
    document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
    const chunks = splitForTTS(text);
    let i = 0;
    function playNext() {
      if (i >= chunks.length) {
        if (btn) btn.classList.remove('speaking');
        ttsAudio = null;
        return;
      }
      const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' +
        encodeURIComponent(lang) + '&q=' + encodeURIComponent(chunks[i]);
      ttsAudio = new Audio(url);
      ttsAudio.referrerPolicy = 'no-referrer';
      i++;
      ttsAudio.addEventListener('ended', playNext);
      ttsAudio.addEventListener('error', (ev) => {
        console.error('TTS loi khi tai am thanh:', url, ev.target && ev.target.error);
        if (btn) btn.classList.remove('speaking');
        ttsAudio = null;
      });
      ttsAudio.play().catch((err) => {
        console.error('TTS loi khi phat am thanh:', url, err);
        if (btn) btn.classList.remove('speaking');
        ttsAudio = null;
      });
    }
    if (btn) btn.classList.add('speaking');
    playNext();
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeToggleBtn').innerHTML = theme === 'light' ? ICON_MOON : ICON_SUN;
    try { localStorage.setItem('bilingualTheme', theme); } catch (e) {}
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  // Co chu: cac muc font-size trong CSS deu dung don vi rem, nen chi can
  // doi font-size cua <html> la toan bo noi dung se phong to/thu nho theo.
  const FONT_STEPS = [87.5, 100, 112.5, 125, 137.5, 150];
  let fontStepIndex = 1;

  function applyFontStep() {
    const pct = FONT_STEPS[fontStepIndex];
    document.documentElement.style.fontSize = pct + '%';
    document.getElementById('fontDecBtn').disabled = fontStepIndex === 0;
    document.getElementById('fontIncBtn').disabled = fontStepIndex === FONT_STEPS.length - 1;
    try { localStorage.setItem('bilingualFontStep', String(fontStepIndex)); } catch (e) {}
  }

  function adjustFontSize(delta) {
    const next = fontStepIndex + delta;
    if (next < 0 || next >= FONT_STEPS.length) return;
    fontStepIndex = next;
    applyFontStep();
  }

  // An/hien phien am (IPA/Pinyin...) - luu lua chon vao localStorage.
  let hidePhonetic = false;

  function applyPhoneticVisibility() {
    document.body.classList.toggle('hide-phonetic', hidePhonetic);
    const btn = document.getElementById('phoneticToggleBtn');
    btn.classList.toggle('active', hidePhonetic);
    btn.title = hidePhonetic ? 'Dang an phien am - bam de hien lai' : 'Dang hien phien am - bam de an';
  }

  function togglePhonetic() {
    hidePhonetic = !hidePhonetic;
    applyPhoneticVisibility();
    try { localStorage.setItem('bilingualHidePhonetic', hidePhonetic ? '1' : '0'); } catch (e) {}
  }

  // Khoi tao
  document.getElementById('sidebarToggleBtn').innerHTML = ICON_LIST;
  let savedTheme = 'dark';
  try { savedTheme = localStorage.getItem('bilingualTheme') || 'dark'; } catch (e) {}
  applyTheme(savedTheme);
  try {
    const savedStep = parseInt(localStorage.getItem('bilingualFontStep'), 10);
    if (!isNaN(savedStep) && savedStep >= 0 && savedStep < FONT_STEPS.length) {
      fontStepIndex = savedStep;
    }
  } catch (e) {}
  applyFontStep();
  try { hidePhonetic = localStorage.getItem('bilingualHidePhonetic') === '1'; } catch (e) {}
  applyPhoneticVisibility();
  updateMarkCount();
  renderSectionList();
  updateLangLabel();
  gotoPage(0);
</script>

</body>
</html>
