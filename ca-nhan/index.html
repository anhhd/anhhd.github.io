<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thư viện tài liệu</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-glow: #12151d;
    --card: #161922;
    --card-hover: #1d212c;
    --text: #edeef1;
    --muted: #888e99;
    --accent: #6ea8ff;
    --accent-dim: #3d5a8a;
    --border: #262b36;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 64px 24px 80px;
    background:
      radial-gradient(600px 300px at 50% 0%, var(--bg-glow), var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, Inter, Arial, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header {
    margin-bottom: 36px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }

  .toolbar {
    margin: 28px 0 20px;
  }
  #search {
    width: 100%;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  /* ===== GRID DANH SÁCH TÀI LIỆU ===== */
  /* Grid tự chia cột, tự căn hàng. Không cần chỉnh gì khi thêm/xóa item. */
  ul.doc-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  ul.doc-grid li a {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    height: 100%;
    padding: 18px 20px 18px 22px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  ul.doc-grid li a::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 3px;
    background: var(--accent-dim);
    transition: background 0.15s ease;
  }
  ul.doc-grid li a:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.5);
  }
  ul.doc-grid li a:hover::before { background: var(--accent); }

  ul.doc-grid li a .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  ul.doc-grid li a .icon {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--accent);
  }
  ul.doc-grid li a .title {
    font-size: 15px;
    font-weight: 600;
  }
  ul.doc-grid li a .desc {
    font-size: 13px;
    line-height: 1.4;
    color: var(--muted);
  }

  .empty {
    display: none;
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 14px;
  }

  footer {
    max-width: 960px;
    margin: 40px auto 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Thư viện tài liệu</h1>
    <p>Danh sách tài liệu HTML trong folder này</p>
  </header>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Tìm tài liệu..." oninput="filterDocs(this.value)">
  </div>

  <!--
    CÁCH THÊM TÀI LIỆU MỚI (mở file này bằng Notepad++):
    1. Copy nguyên 1 khối <li>...</li> bên dưới.
    2. Dán vào trước dòng </ul>.
    3. Sửa href = tên file html, title = tên hiển thị, desc = mô tả ngắn (có thể xóa dòng desc nếu không cần).
    Không cần sửa CSS hay chỉnh vị trí - grid tự căn.
  -->
  <ul class="doc-grid" id="docGrid">
    <li>
      <a href="index-tieng-trung.html">
        <span class="title-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
          <span class="title">Tiếng Trung</span>
        </span>
        <span class="desc">Tài liệu tiếng Trung</span>
      </a>
      <a href="danh-ngon.html">
        <span class="title-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
          <span class="title">Danh ngôn</span>
        </span>
        <span class="desc">Thơ & châm ngôn</span>
      </a> 
    </li>
  </ul>

  <p class="empty" id="emptyState">Không tìm thấy tài liệu nào.</p>

</div>

<script>
  function filterDocs(query) {
    var q = query.trim().toLowerCase();
    var items = document.querySelectorAll('#docGrid li');
    var visibleCount = 0;
    items.forEach(function (li) {
      var text = li.textContent.toLowerCase();
      var match = text.indexOf(q) !== -1;
      li.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });
    document.getElementById('emptyState').style.display = visibleCount === 0 ? 'block' : 'none';
  }
</script>
</body>
</html>
